services:
  - type: web
    name: servicenow-google-adk-a2a-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agent:a2a_app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_ADK_MODEL
        value: gemini-2.5-flash
